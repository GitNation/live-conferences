{% set subscriptionData = payload.components.subscriptionPopup %}

<div class="popup-subscription js-subscription-container" id="mc_embed_signup">
	<button type="button" class="popup-subscription__close js-subscription-close"></button>
	<div class="popup-subscription__content">
		<div class="popup-subscription__title">{{ subscriptionData.title }}</div>
		<div class="popup-subscription__descr">{{ subscriptionData.description }}</div>

		<!-- Begin Mailchimp Signup Form -->

		<form
			action="https://gitnation.com/newsletter-preferences"
			class="validate js-subscription-form"
			method="GET"
			target="_blank">
			<div class="mc-field-group">
				<input class="popup-subscription__input  email" name="email" required="" type="email" placeholder="Email Address" />
			</div>
			<div class="mc-field-group">
				<input class="popup-subscription__input " name="firstName" required="" type="text" placeholder="First Name or Twitter handle" />
			</div>
			<div class="popup-subscription__btns clear">
				<input class="popup-subscription__submit button" name="subscribe" type="submit" value="Subscribe" />
			</div>

		</form>
		<!--End mc_embed_signup-->
	</div>

</div>
