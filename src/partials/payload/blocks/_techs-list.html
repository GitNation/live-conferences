<ul class="techs scrollbar" {{ editable(techsData) }}>
	{% for item in techsData.items %}
	<li class="techs__item" {{ editable(item) }}>
		<div class="techs__img-box">
			<picture>
				<img class="techs__img" src="{{ item.icon.url }}" alt="{{ item.title }}" role="presentation" {{ svgSize(item.icon) }} />
			</picture>
		</div>
		<div class="techs__title">{{ item.title | safe }}</div>
	</li>
	{% endfor %}
</ul>
