{% set noticeData = payload.components.noticePanel %}

<div class="notice-panel js-notice-panel" style="display: none;">

  <div class="container">
    <div class="notice-panel__desc">{{ noticeData.description }}</div>
    <a tabindex="0" class="notice-panel__btn btn btn--alt" target="_blank" href="{{ noticeData.button.url }}">
      {{ noticeData.button.label }}
    </a>
  </div>

  <button aria-label="notice close" class="notice-panel__close js-notice-close" style="background-color: transparent; border: none;">
    <span></span>
    <span></span>
  </button>
</div>
