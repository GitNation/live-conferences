<section class="section s-teams bg-black" id="teams" {{ editable(teamsData) }}>
	<div class="container">
		{% if teamsData.title %}
		<div class="section__head">
			<h2 class="section__title">{{ teamsData.title | safe }}</h2>
		</div>
		{% endif %}
		<div class="s-teams__content">{{ teamsData.content | safe }}</div>
	</div>
</section>
