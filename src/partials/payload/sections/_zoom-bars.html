<section class="section zoom-bars" id="zoom-bars">
	<div class="container">
		{% if zoomBarsData.title %}
		<h2 class="section__title">{{ zoomBarsData.title }}</h2>
		{% endif %}

		{% if zoomBarsData.description %}
		<div class="section__subtitle">{{ zoomBarsData.description | safe }}</div>
		{% endif %}
	</div>
</section>
