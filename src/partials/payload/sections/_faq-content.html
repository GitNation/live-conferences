<div class="section faq" itemscope itemtype="https://schema.org/FAQPage" {{ editable(faqData) }}>
	<div class="container">
		<div class="section__head">
			{% if faqData.title %}
			<h2 class="section__title js-clip-split" {% if confName=='rdb' %} data-title="{{faqData.title}}" {% endif %}>{{ faqData.title }}</h2>
			{% endif %}
			{% if faqData.description %}
			<div class="faq__description">{{ faqData.description | safe }}</div>
			{% endif %}
		</div>

		<div class="faq__content">
			{% for group in faqData.groups %}
			<h3 class="faq__section-title" {{ editable(group) }}>{{ group.title }}</h3>

			<ul class="faq__list">
				{% for item in group.items %}
				<li class="faq__item js-accordion-item" {{ editableDoc('faqs', item.id) }}
					itemscope
					itemprop="mainEntity"
					itemtype="https://schema.org/Question">

					<button class="faq__question js-accordion-toggler" itemprop="name">{{ item.question }}</button>
					<div class="faq__ansver js-accordion-spoiler"
						itemscope
						itemprop="acceptedAnswer"
						itemtype="https://schema.org/Answer">
						<div itemprop="text">{{ item.answer | safe }}</div>
					</div>
				</li>
				{% endfor %}
			</ul>
			{% endfor %}
		</div>
	</div>
</div>
