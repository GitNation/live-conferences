<section class="section s-for-boss {{animationOnScroll}}" id="for-boss" {{ editable(forBossData) }}>
  <div class="container">
    <div class="for-boss">
      <div class="for-boss__content">
        <div class="for-boss__text">

          <h2 class="for-boss__title section__title" data-title="{{ forBossData.title }}">{{ forBossData.title }}</h2>
          {% if forBossData.suptitle %}
          <h3 class="for-boss__suptitle section__suptitle">{{ forBossData.suptitle }}</h3>
          {% endif %}
          <div class="for-boss__desc" data-typing-wrapper>
            <div data-typing-text>{{ forBossData.description | safe }}</div>
          </div>
          {% if forBossData.button.label %}
          <a class="for-boss__btn btn btn--transparent" href="{{ forBossData.button.url }}" data-title="{{ forBossData.button.label }}"{% if forBossData.button.openInNewTab %} target="_blank" rel="noopener"{% endif %}>{{ forBossData.button.label }}</a>
          {% endif %}
        </div>

        <div class="for-boss__img">
          <img src="img/for-boss.png" alt="" loading="lazy" role="presentation" />
        </div>
      </div>
    </div>
  </div>
</section>
