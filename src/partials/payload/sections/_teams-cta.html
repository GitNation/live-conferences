<section class="section s-teams-cta" id="teams-cta" {{ editable(ctaData) }}>
	<div class="container">
		<div class="teams-cta">
			<h2 class="teams-cta__title">{{ ctaData.title | safe }}</h2>

			<div class="teams-cta__btns">
				{% for b in ctaData.buttons %}
				{% if b.label %}
				{{mixins.btn(b)}}
				{% endif %}
				{% endfor %}
			</div>
		</div>
	</div>
</section>
