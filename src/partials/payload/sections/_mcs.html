<section class="section s-mc s-speakers" id="mcs" {{ editable(mcsData) }}>
	<div class="container">
		{% if mcsData.title %}
		<div class="section__head">
			<h2 class="section__title">{{ mcsData.title }}</h2>
		</div>
		{% endif %}

		<div class="speakers-list">
			{% for person in ems.mcs %}
			<div class="speakers-list__item" id="mcs-{{ person.slug }}-id">
				{{ mixins.speaker(person, inPerson, eventsLayer, not fakeLinks, id="mcs", confName = confName) }}
			</div>
			{% endfor %}
		</div>
	</div>
</section>
