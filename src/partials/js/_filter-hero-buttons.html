<script>
	// Hero buttons for every phase are rendered at once (see partials/_hero-buttons*.html)
	// and hidden via .is-hidden. Here we reveal the one matching the current phase.
	(function () {
		// new Date('nonsense') yields Invalid Date, which is truthy — hence the isNaN check
		const pick = (a, b) => (isNaN(new Date(a)) ? new Date(b) : new Date(a));

		const start = pick('{{customContent.eventInfo.emsEvent.startDate}}', '{{customContent.eventInfo.conferenceStart}}');
		const end = pick('{{customContent.eventInfo.emsEvent.endDate}}', '{{customContent.eventInfo.conferenceFinish}}');

		if (isNaN(start) || isNaN(end)) return;

		// start of the day, `days` away from `date`
		const dayStart = (date, days) => {
			const d = new Date(date);
			d.setDate(d.getDate() + days);
			d.setHours(0, 0, 0, 0);
			return d;
		};

		// ordered by time — the first phase we are still ahead of wins
		const phases = [
			[dayStart(start, -2), null], // long before — keep the default button
			[dayStart(start, 0), 'js-hero-btn1'],
			[dayStart(end, 1), 'js-hero-btn2'],
			[dayStart(end, 7), 'js-hero-btn3'],
		];

		const phase = phases.find(([until]) => new Date() < until);
		const css = phase
			? phase[1] && `.${phase[1]} { display: flex !important }
				.js-hero-btn-default { display: none !important }`
			: // a week past the conference: drop every button and offer the waitlist instead
				`.js-hero-btn-default, .js-hero-btn1, .js-hero-btn2, .js-hero-btn3 { display: none !important }
				.js-join-waitlist { display: block !important }`;

		if (css) {
			const style = document.createElement('style');
			style.textContent = css;
			document.head.appendChild(style);
		}
	})();
</script>
