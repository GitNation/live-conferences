<div class="hero" id="hero" {{ editable(heroData) }}>
	<video preload="auto" muted autoplay loop playsinline poster="img/hero_poster.jpg" class="hero__video">
		<source src="video/hero.mp4?v1" type="video/mp4" />
	</video>
	<div class="container hero__inner">

		{% if heroData.date %}
		<div class="hero__date">{{ heroData.date | safe }}</div>
		{% endif %}

		<h1 class="hero__title {{ 'hero__title--main' if pageKey == 'main' }}">{{ heroData.title | safe }}</h1>
		<div class="hero__info">
			{% if heroData.stats.length %}
			{% include "partials/payload/blocks/_hero-stats.html" %}
			{% endif %}


		</div>
	</div>
	{% if not hideHeroCtas %}
	<div class="hero__bottom">
		<div class="container">
			{% include "partials/payload/blocks/_hero-buttons.html" %}
		</div>
	</div>
	{% endif %}

	<!-- <div class="hero__bg " style="background-image: url('img/hero-bg.svg');"></div> -->
</div>
