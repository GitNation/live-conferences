<section class="s-city section" {{ editable(cityData) }}>
	<div class="container">
		<div class="city__controls">
			<button class="slider-btn slider-prev js-slider-prev">{{mixins.icon('arrow')}}</button>
			<button class="slider-btn slider-next js-slider-next">{{mixins.icon('arrow')}}</button>
		</div>
		<div class="section__head">
			<h3 class="section__title js-clip-split" data-title="{{cityData.title}}">{{ cityData.title }}</h3>
			{% if cityData.description %}
			<div class="section__description ">
				{{ cityData.description | safe }}
			</div>
			{% endif %}
		</div>


		<div class="city__slider js-slider">
			<div class="swiper-wrapper">
				<div class="city__slide upd swiper-slide">
					<div class="cslide" style="background-image: url(https://media.graphcms.com/resize=fit:crop,height:600,width:900/output=format:webp/PrZFHGQCq5UUt0Mp7Zwp);">
						<p class="cslide__desc">
							Oberbaum Bridge
						</p>
					</div>
				</div>
				<div class="city__slide swiper-slide">
					<div class="cslide" style="background-image: url(https://media.graphcms.com/resize=fit:crop,height:600,width:900/output=format:webp/ZnzCnWyZTxqz98yvCuuT);">
						<p class="cslide__desc">
							Museum island on Spree river in center Berlin
						</p>
					</div>
				</div>
				<div class="city__slide swiper-slide">
					<div class="cslide" style="background-image: url(https://media.graphcms.com/resize=fit:crop,height:600,width:900/output=format:webp/I7q5ESJTi6mwwWUo8WAM);">
						<p class="cslide__desc">
							Berlin skyline with Spree river at sunset
						</p>
					</div>
				</div>
				<div class="city__slide swiper-slide">
					<div class="cslide" style="background-image: url(https://media.graphcms.com/resize=fit:crop,height:600,width:900/output=format:webp/KRvTtYXRLAh302qsJ4Iw);">
						<p class="cslide__desc">
							Brandenburg gate at the sunset
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
