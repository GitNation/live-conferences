<section class="section section--inner sec-faq" {{ editable(faqData) }}>
  <div class="section__row">
    <div class="section__col-3 theme-bg" data-jq-clipthru="clipthru">

    </div>
    <div class="section__col-4">
      <div class="section__container">
        <div class="section__right"></div>
        <div class="section__left">
          <p>
            Frequently
          </p>
          <p>
            Asked
          </p>
          <p>
            Questions
          </p>
        </div>
        <div class="section__title section__title--inner">
          <h1 class="section-title section-title_thin-sm js-clip">{{ faqData.title or 'FAQ' }}</h1>
        </div>
        <div class="">
          {{ faqData.description | safe }}
        </div>

        <div class="faq__content">
          {% for group in faqData.groups %}
          <h3 class="faq__section-title" {{ editable(group) }}>{{ group.title }}</h3>

          <ul class="faq__list">
            {% for item in group.items %}
            <li class="faq__item graphcms-container js-accordion-item" {{ editableDoc('faqs', item.id) }}
              itemscope
              itemprop="mainEntity"
              itemtype="https://schema.org/Question">

              <button class="faq__question js-accordion-toggler" itemprop="name">{{ item.question | safe }}</button>
              <div class="faq__ansver js-accordion-spoiler"
                itemscope
                itemprop="acceptedAnswer"
                itemtype="https://schema.org/Answer">
                <div itemprop="text">{{ item.answer | safe }}</div>
              </div>
            </li>
            {% endfor %}
          </ul>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
