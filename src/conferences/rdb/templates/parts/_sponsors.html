<section class="sponsors section js-section" id="sponsors" {{ editable(sponsorsData) }}>
  <div class="section__row">
    <div class="section__col-1"></div>
    <div class="section__col-2 theme-bg" data-jq-clipthru="clipthru">
      <div class="section__container">
        <div class="section__title sponsors__title">
          <h2 class="section-title js-clip js-title" id="sponsors">{{ sponsorsData.title }}</h2>
        </div>
        <div class="text white-color">
          {{ sponsorsData.description | safe }}
        </div>
        <div class="sponsors__link">
          {{ sponsorsData.offer | safe }}
        </div>
      </div>
    </div>
  </div>
  <div class="sponsors__items">
    {{ mixins.sponsors(ems.sponsors, not fakeLinks, eventsLayer, ga_mixins) }}
  </div>
</section>
