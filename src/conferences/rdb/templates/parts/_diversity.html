<section class="section diversity" id="diversity" {{ editable(diversityData) }}>
  <div class="section__row">
    <div class="section__col-1"></div>
    <div class="section__col-2">
      <div class="section__container section__container--l">
        <div class="section__title diversity__title">
          <h2 class="section-title js-clip">{{ diversityData.title }}</h2>
        </div>
      </div>
      <div class="section__container section__container--sm">
        <div class="text-lg diversity__text">
          {{ diversityData.description | safe }}
        </div>
      </div>
    </div>
  </div>
  <div class="container">
	<div class="diversity__partners">
    {# no payload data #}
    {% for item in diversity.sponsors %}
    <a href="{{ item.link }}" class="diversity__partner">
      <img src="{{ item.avatar }}" alt="{{item.title}}"/>
    </a>
    {% endfor %}
	</div>

	<p class="diversity__progress-title">{{ diversityData.sponsoredTickets }} of 100 extra diversity scholarships sponsored</p>

	<div class="diversity__progress-bar">
		<div class="diversity__progress" style="width:{{ diversityData.sponsoredTickets }}%"></div>
	</div>

  <div class="diversity__buttons">
    {{ mixins.btns(diversityData.buttons, 'diversity__btn') }}
  </div>


  </div>
</section>
