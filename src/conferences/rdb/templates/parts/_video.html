<section class="s-video section" {{ editable(videoData) }}>
	<div class="container">
		<div class="video">
			{% if videoData.youtubeId %}
			<iframe loading="lazy" width="560" height="315" src="https://www.youtube.com/embed/{{ videoData.youtubeId }}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
			{% endif %}
		</div>
	</div>
</section>
