<section class="location section" id="location" {{ editable(locationData) }}>
	<div class="container">
		<div class="section__head ">
			<h2 class="section__title js-clip-split" data-title="{{locationData.title}}">{{ locationData.title }}</h2>
			<div class="section__description">
				{{ locationData.description | safe }}
			</div>
		</div>

		<div class="location__map">
			<picture class="map">
				<source srcset="img/map_md.png" media="(max-width: 1200px)" />
				<source srcset="img/map_xl.png" media="(max-width: 1920px)" />
				<img src="img/map_xl.png" alt="map" />
			</picture>
		</div>

		<div class="location__info" id="contact-form">
			<div class="location__visual js-lazy-bg" style="background-image: url({{ locationData.video.poster.url }});">
				<div class="location__address">
					{{ locationData.address | safe }}
				</div>
			</div>

			{% set followUsData = block('followUs') %}
			{% if followUsData %}
			{% include "partials/payload/sections/_contact-form.html" %}
			{% endif %}
		</div>
	</div>
</section>
